[package]
name = "CasaBaldini"
version = "0.1.0"
authors = ["carlozanieri <carlo.zanieri@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.3", features = ["json", "rustls"] }
web-sys = "0.3.98"

[target.'cfg(target_os = "linux")'.dependencies]
axum = "=0.8.9"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6.10", features = ["fs"] }
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
server = ["dioxus/server"]
